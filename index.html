<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Engine: The Knowledge Universe</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #02040a; /* Darker background */
        }
        #galaxy-canvas {
            position: absolute; /* Changed from fixed to work within flex container */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .ui-layer {
            position: relative;
            z-index: 10;
        }
        .glass-effect {
            background: rgba(10, 14, 26, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .modal-bg {
            background-color: rgba(3, 6, 18, 0.7);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.2);
            border-top: 4px solid #818cf8;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .tooltip {
            position: fixed;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.8rem;
            pointer-events: none;
            transition: opacity 0.2s;
            opacity: 0;
            max-width: 250px;
            transform: translate(-50%, -120%);
        }
        .world-label {
            position: absolute; /* FIX: Changed from fixed to absolute */
            color: #e0e7ff;
            font-size: 1.5rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0.3;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(79, 70, 229, 0.5);
        }
        .planet-label {
             position: absolute; /* FIX: Changed from fixed to absolute */
             color: #d1d5db;
             font-size: 0.75rem;
             background: rgba(10,14,26,0.5);
             padding: 2px 6px;
             border-radius: 4px;
             transform: translate(-50%, 15px);
             cursor: pointer;
             pointer-events: auto !important;
             transition: all 0.2s ease;
        }
        .planet-label:hover {
            color: #fff;
            background: #4f46e5;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 20px;
            height: 20px;
            background: #818cf8;
            cursor: pointer;
            border-radius: 50%;
            border: 2px solid #e0e7ff;
        }
        input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: #818cf8;
            cursor: pointer;
            border-radius: 50%;
             border: 2px solid #e0e7ff;
        }
        .sidebar-transition {
            transition: width 0.3s ease-in-out;
        }
        .tab-active {
            background-color: #4f46e5;
            color: #ffffff;
        }
        .tab-inactive {
            background-color: rgba(255,255,255,0.1);
            color: #d1d5db;
            border-color: transparent;
        }
        .hypothesis-item {
            cursor: grab;
            touch-action: none;
        }
         .hypothesis-item:active {
            cursor: grabbing;
        }
        .hypothesis-drop-zone {
            border-style: dashed;
        }
        .hypothesis-correct {
             background-color: rgba(52, 211, 153, 0.2);
             border-color: #34d399;
        }
        /* Scrollbar Hide */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
</head>
<body class="h-full bg-gray-900 text-gray-200 overflow-hidden">
    <div id="root" class="h-full"></div>
    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef, useCallback } = React;

        // --- BYOK (bring your own key) ---
        // The user's Gemini key is stored in localStorage and never committed.
        // This is a Phase-0 stopgap; Phase 1 replaces it with a proper modal
        // in src/ui/ApiKeyModal.jsx and validation via models.list.
        const GEMINI_KEY_STORAGE = 'starengine.geminiKey';
        const getApiKey = () => {
            let key = window.localStorage.getItem(GEMINI_KEY_STORAGE);
            if (!key) {
                key = window.prompt(
                    "Paste your Gemini API key to enable AI features.\n" +
                    "Get one free at https://aistudio.google.com/apikey\n" +
                    "The key is stored only in your browser."
                );
                if (key) {
                    key = key.trim();
                    window.localStorage.setItem(GEMINI_KEY_STORAGE, key);
                }
            }
            return key || null;
        };

        // --- REAL DATA PROCESSING ---
        const processRealData = (publicationsData, knowledgeGraph) => {
            // 1. Create a map for related papers from edges
            const relatedPapersMap = new Map();
            knowledgeGraph.edges.forEach(edge => {
                if (edge.source && edge.target && edge.source.startsWith('paper:') && edge.target.startsWith('paper:')) {
                    const sourceId = edge.source.replace('paper:', '');
                    const targetId = edge.target.replace('paper:', '');
                    
                    if (!relatedPapersMap.has(sourceId)) relatedPapersMap.set(sourceId, new Set());
                    if (!relatedPapersMap.has(targetId)) relatedPapersMap.set(targetId, new Set());
                    
                    relatedPapersMap.get(sourceId).add(targetId);
                    relatedPapersMap.get(targetId).add(sourceId); // Relationships are bidirectional for the graph
                }
            });
            // 2. Create maps for organisms and concepts from nodes
            const paperInfoMap = new Map();
            knowledgeGraph.nodes.forEach(node => {
                if (node.paper_mentions && Array.isArray(node.paper_mentions)) {
                    node.paper_mentions.forEach(paperId => {
                        if (!paperInfoMap.has(paperId)) {
                            paperInfoMap.set(paperId, { organisms: new Set(), concepts: [] });
                        }
                        const info = paperInfoMap.get(paperId);
                        
                        // Extract and normalize organism names
                        if (node.label === 'Organism') {
                            const nodeNameLower = node.name.toLowerCase();
                            let organismName = 'Microbe'; // Default
                            if (nodeNameLower.includes('human') || nodeNameLower.includes('homo sapien')) organismName = 'Human';
                            else if (nodeNameLower.includes('mouse') || nodeNameLower.includes('mus musculus')) organismName = 'Mouse';
                            else if (node.subtype && node.subtype.toLowerCase().includes('plant')) organismName = 'Plant';
                            info.organisms.add(organismName);
                        }
                        
                        // Add other node types as concepts
                        info.concepts.push({ name: node.name, type: node.label });
                    });
                }
            });
            // 3. Process the publications object from publications.json
            const publicationsArray = Object.values(publicationsData).map(p => {
                if (!p.pmc_id) return null; // Skip if entry is invalid
                
                const id = p.pmc_id;
                const info = paperInfoMap.get(id) || { organisms: new Set(), concepts: [] };
                
                // Pick the first organism, or default
                const organism = info.organisms.values().next().value || 'Microbe';
                return {
                    id: id,
                    title: p.title || "Untitled Publication",
                    authors: Array.isArray(p.authors) ? p.authors.join(', ') : "N/A",
                    year: p.year ? parseInt(p.year, 10) : 2020,
                    journal: p.journal || "Unknown Journal",
                    doi: p.doi || null,
                    summary: p.abstract || 'No abstract available.',
                    keywords: p.keywords || [],
                    organism: organism,
                    // Generate random citation count as it's not in the real data
                    citation_count: 50 + Math.floor(Math.random() * 450),
                    mission: p.mission || 'N/A',
                    related_papers: Array.from(relatedPapersMap.get(id) || []),
                    // Limit concepts to a reasonable number for the solar system view
                    concepts: info.concepts.slice(0, 6)
                };
            }).filter(Boolean); // Filter out any null entries
            return publicationsArray;
        };
        // --- CONSTANTS & HELPERS ---
        const ORGANISM_CONFIG = { 'Plant': { color: 0x4ade80, icon: 'fa-seedling' }, 'Mouse': { color: 0x60a5fa, icon: 'fa-hippo' }, 'Human': { color: 0xfb923c, icon: 'fa-user-astronaut' }, 'Microbe': { color: 0xf8fafc, icon: 'fa-microscope' }, 'Default': { color: 0x94a3b8, icon: 'fa-dna' } };
        const MISSION_CENTERS = { 'ISS': { x: -300, y: 100, z: 0 }, 'Ground Study': { x: 0, y: -150, z: 100 }, 'Shuttle': { x: 300, y: 100, z: -50 }, 'Bion-M': { x: 150, y: 200, z: -200 }, 'N/A': {x: 0, y: 0, z: 0} };
        const CONSTELLATION_KEYWORDS = ['Human', 'Mouse', 'Plant', 'Microbe'];
        
        // --- UI COMPONENTS ---
        const WorldUILabel = ({ labelData, camera, canvasRef }) => {
            const elRef = useRef(null);
            useEffect(() => {
                let animationFrameId;
                const animate = () => {
                    if (elRef.current && camera && canvasRef.current) {
                        const rect = canvasRef.current.getBoundingClientRect();
                        const screenPosition = labelData.position.clone().project(camera);
                        const x = (screenPosition.x + 1) / 2 * rect.width;
                        const y = (-screenPosition.y + 1) / 2 * rect.height;
                        elRef.current.style.transform = `translate(-50%, -50%) translate(${x}px, ${y}px)`;
                        elRef.current.style.opacity = labelData.visible ? '0.3' : '0';
                    }
                    animationFrameId = requestAnimationFrame(animate);
                };
                animate();
                return () => cancelAnimationFrame(animationFrameId);
            }, [labelData, camera, canvasRef]);
            return <div ref={elRef} className="world-label">{labelData.name}</div>;
        };

        const MarkdownRenderer = ({ content }) => {
            const renderedContent = useMemo(() => {
                if (!content) return null;

                const lines = content.split('\n').filter(line => line.trim() !== '');

                const elements = [];
                let listItems = [];

                const flushList = () => {
                    if (listItems.length > 0) {
                        elements.push(<ul key={`ul-${elements.length}`} className="list-disc pl-5 space-y-1 mb-3">{listItems}</ul>);
                        listItems = [];
                    }
                };

                lines.forEach((line, index) => {
                    const trimmedLine = line.trim();
                    const isListItem = trimmedLine.startsWith('* ') || trimmedLine.startsWith('- ') || trimmedLine.startsWith('• ');

                    if (isListItem) {
                        const itemContent = trimmedLine.substring(2);
                        const parts = itemContent.split(/(\*\*.*?\*\*)/g);
                        listItems.push(
                            <li key={index}>
                                {parts.map((part, i) =>
                                    part.startsWith('**') ? <strong key={i}>{part.slice(2, -2)}</strong> : part
                                )}
                            </li>
                        );
                    } else {
                        flushList();
                        const parts = line.split(/(\*\*.*?\*\*)/g);
                        elements.push(
                            <p key={index} className="mb-3">
                                {parts.map((part, i) =>
                                    part.startsWith('**') ? <strong key={i}>{part.slice(2, -2)}</strong> : part
                                )}
                            </p>
                        );
                    }
                });

                flushList();
                return elements;

            }, [content]);

            return <div>{renderedContent}</div>;
        };


        // --- THREE.JS GALAXY COMPONENT ---
        const GalaxyView = ({ publications, onStarClick, onStarDoubleClick, onBackgroundClick, onPlanetClick, focusedStar, pulsingConcept, filters, temporalFilter, lens }) => {
            const mountRef = useRef(null);
            const sceneRef = useRef(null);
            const cameraRef = useRef(null);
            const rendererRef = useRef(null);
            const controlsRef = useRef(null);
            const tooltipRef = useRef(null);
            const starsRef = useRef(new Map());
            const linesRef = useRef([]);
            const hoveredStarRef = useRef(null);
            const clickTimeoutRef = useRef(null);
            const starTextureRef = useRef(null);
            const focusedGroupRef = useRef(null);
            const [constellationLabels, setConstellationLabels] = useState([]);
            const [planetLabels, setPlanetLabels] = useState([]);
            
            const getStarColor = (organism) => (ORGANISM_CONFIG[organism] || ORGANISM_CONFIG.Default).color;
            if(!starTextureRef.current) {
                const canvas = document.createElement('canvas');
                canvas.width = 64; canvas.height = 64;
                const context = canvas.getContext('2d');
                const gradient = context.createRadialGradient(32, 32, 0, 32, 32, 32);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 1)'); gradient.addColorStop(0.2, 'rgba(255, 255, 255, 0.8)'); gradient.addColorStop(0.4, 'rgba(255, 255, 255, 0.3)'); gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');
                context.fillStyle = gradient; context.fillRect(0, 0, 64, 64);
                starTextureRef.current = new THREE.CanvasTexture(canvas);
            }
            // Initialize Scene
            useEffect(() => {
                const mountNode = mountRef.current;
                const scene = new THREE.Scene(); sceneRef.current = scene;
                const camera = new THREE.PerspectiveCamera(75, mountNode.clientWidth / mountNode.clientHeight, 0.1, 2000);
                camera.position.z = 500; cameraRef.current = camera;
                const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
                renderer.setSize(mountNode.clientWidth, mountNode.clientHeight); renderer.setPixelRatio(window.devicePixelRatio);
                rendererRef.current = renderer;
                mountNode.appendChild(renderer.domElement);
                const controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true; controls.dampingFactor = 0.05; controls.screenSpacePanning = false;
                controls.minDistance = 50; controls.maxDistance = 1000; controlsRef.current = controls;
                const raycaster = new THREE.Raycaster(); const mouse = new THREE.Vector2();
                const animate = () => {
                    requestAnimationFrame(animate);
                    const focusedStarData = focusedStar ? starsRef.current.get(focusedStar.id) : null;
                    if (focusedStarData) {
                        const offset = new THREE.Vector3(0, 0, 80);
                        const targetPosition = focusedStarData.position.clone().add(offset);
                        camera.position.lerp(targetPosition, 0.04);
                        controls.target.lerp(focusedStarData.position, 0.04);
                    }
                    controls.update();
                    starsRef.current.forEach((star) => {
                         const targetScale = hoveredStarRef.current === star.userData.id || (star.isPulsing && !focusedStar) ? 1.5 : 1;
                         const scale = star.userData.baseScale * targetScale * (focusedStar ? (focusedStar.id === star.userData.id ? 1.8 : 0.2) : 1);
                         star.scale.x = THREE.MathUtils.lerp(star.scale.x, scale, 0.1);
                         star.scale.y = THREE.MathUtils.lerp(star.scale.y, scale, 0.1);
                    });
                     if (focusedGroupRef.current) {
                           focusedGroupRef.current.rotation.y += 0.005;
                           setPlanetLabels(prev => prev.map(p => ({...p, position: p.object.getWorldPosition(new THREE.Vector3())})));
                      }
                    renderer.render(scene, camera);
                };
                animate();
                const handleResize = () => { camera.aspect = mountNode.clientWidth / mountNode.clientHeight; camera.updateProjectionMatrix(); renderer.setSize(mountNode.clientWidth, mountNode.clientHeight); };
                const resizeObserver = new ResizeObserver(handleResize);
                resizeObserver.observe(mountNode);
                const handleMouseMove = (event) => {
                    if (!renderer.domElement || !tooltipRef.current) return;
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(camera, mouse);
                    const intersects = raycaster.intersectObjects(Array.from(starsRef.current.values()));
                    
                    if (intersects.length > 0 && !focusedStar) {
                        const intersectedStar = intersects[0].object;
                        hoveredStarRef.current = intersectedStar.userData.id;
                        const tooltip = tooltipRef.current;
                        tooltip.style.opacity = '1';
                        tooltip.style.left = `${event.clientX}px`;
                        tooltip.style.top = `${event.clientY}px`;
                        tooltip.innerHTML = `<strong>${intersectedStar.userData.title}</strong><br/>${intersectedStar.userData.authors} (${intersectedStar.userData.year})`;
                        mountNode.style.cursor = 'pointer';
                    } else {
                        hoveredStarRef.current = null;
                        tooltipRef.current.style.opacity = '0';
                        mountNode.style.cursor = 'auto';
                    }
                };
                const handlePointerDown = (event) => {
                    event.preventDefault();
                    const rect = renderer.domElement.getBoundingClientRect();
                    mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
                    mouse.y = - ((event.clientY - rect.top) / rect.height) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(Array.from(starsRef.current.values()));
                    
                    if (clickTimeoutRef.current) { // Double click
                        clearTimeout(clickTimeoutRef.current);
                        clickTimeoutRef.current = null;
                        if(intersects.length > 0) onStarDoubleClick(intersects[0].object.userData);
                    } else { // Single click
                        clickTimeoutRef.current = setTimeout(() => {
                            if(intersects.length > 0) {
                                onStarClick(intersects[0].object.userData);
                            } else {
                                if (!event.target.classList.contains('planet-label')) onBackgroundClick();
                            }
                            clickTimeoutRef.current = null;
                        }, 250);
                    }
                };
                
                mountNode.addEventListener('pointerdown', handlePointerDown);
                mountNode.addEventListener('mousemove', handleMouseMove);
                return () => { resizeObserver.unobserve(mountNode); mountNode.removeEventListener('pointerdown', handlePointerDown); mountNode.removeEventListener('mousemove', handleMouseMove); if(mountNode.contains(renderer.domElement)) mountNode.removeChild(renderer.domElement); };
            }, []);
            // Update Scene Objects
            useEffect(() => {
                const scene = sceneRef.current;
                if (!scene || !publications) return;
                
                starsRef.current.forEach(star => scene.remove(star));
                starsRef.current.clear();
                linesRef.current.forEach(line => scene.remove(line));
                linesRef.current = [];
                if (focusedGroupRef.current) scene.remove(focusedGroupRef.current);
                setPlanetLabels([]);
                let constellationCenters = (lens === 'mission')
                    ? MISSION_CENTERS
                    : CONSTELLATION_KEYWORDS.reduce((acc, key, i) => {
                        const angle = (i / CONSTELLATION_KEYWORDS.length) * Math.PI * 2;
                        acc[key] = { x: 350 * Math.cos(angle), y: 100 * Math.sin(i * Math.PI), z: 350 * Math.sin(angle) };
                        return acc;
                    }, {});
                const dynamicConstellationInfo = {};
                Object.keys(constellationCenters).forEach(key => {
                    dynamicConstellationInfo[key] = { center: new THREE.Vector3(), count: 0 };
                });
                const validYears = publications.map(p => p.year).filter(y => y > 1900);
                const minPubYear = Math.min(...validYears);
                const maxPubYear = Math.max(...validYears);
                
                publications.forEach(p => {
                    const { citation_count, year, organism } = p;
                    const luminosity = 0.8 + Math.min(citation_count / 500, 1) * 0.7;
                    const baseScale = 15 + ((year - minPubYear) / (maxPubYear - minPubYear)) * 15;
                    const material = new THREE.SpriteMaterial({ map: starTextureRef.current, color: getStarColor(organism), opacity: luminosity, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false, });
                    const star = new THREE.Sprite(material);
                    let key = (lens === 'mission') ? p.mission : CONSTELLATION_KEYWORDS.find(k => k === p.organism) || 'Microbe';
                    const center = constellationCenters[key] || { x: 0, y: 0, z: 0 };
                    star.position.set(center.x + (Math.random() - 0.5) * 250, center.y + (Math.random() - 0.5) * 250, center.z + (Math.random() - 0.5) * 250);
                    star.scale.set(baseScale, baseScale, 1);
                    star.userData = { ...p, baseScale };
                    const isVisibleByYear = p.year >= temporalFilter.min && p.year <= temporalFilter.max;
                    const isFilteredOut = filters.filteredIds !== null && !filters.filteredIds.has(p.id);
                    star.visible = isVisibleByYear && !isFilteredOut;
                    // FIX: Removed search term dependency from pulsing logic
                    star.isPulsing = (pulsingConcept && p.keywords.includes(pulsingConcept));
                    starsRef.current.set(p.id, star);
                    scene.add(star);
                    if (star.visible && dynamicConstellationInfo[key]) {
                        dynamicConstellationInfo[key].center.add(star.position);
                        dynamicConstellationInfo[key].count++;
                    }
                });
                const newConstellationLabels = Object.entries(dynamicConstellationInfo).map(([name, info]) => {
                    const isLabelVisible = info.count > 0 && lens !== 'mission' && !focusedStar;
                    const position = isLabelVisible ? info.center.divideScalar(info.count) : new THREE.Vector3(0, 0, -2000);
                    return { name, position, visible: isLabelVisible };
                });
                setConstellationLabels(newConstellationLabels);
                if (focusedStar) {
                    const focusedStarData = starsRef.current.get(focusedStar.id);
                    if (focusedStarData) {
                      focusedGroupRef.current = new THREE.Group();
                      focusedGroupRef.current.position.copy(focusedStarData.position);
                      const newPlanetLabels = [];
                      focusedStar.concepts.forEach((concept, i) => {
                          const radius = 25 + i * 10;
                          const angle = (i / focusedStar.concepts.length) * Math.PI * 2 + Math.random();
                          const planet = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), new THREE.MeshBasicMaterial({color: 0xa5b4fc}));
                          planet.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
                          focusedGroupRef.current.add(planet);
                          newPlanetLabels.push({ name: concept.name, type: concept.type, object: planet, position: planet.getWorldPosition(new THREE.Vector3()) });
                      });
                      scene.add(focusedGroupRef.current);
                      setPlanetLabels(newPlanetLabels);
                    }
                } else {
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0x4f46e5, opacity: 0.1, transparent: true, depthWrite: false });
                    publications.forEach(p => { const sourceStar = starsRef.current.get(p.id); if (sourceStar && sourceStar.visible && p.related_papers) { p.related_papers.forEach(relatedId => { const targetStar = starsRef.current.get(relatedId); if (targetStar && targetStar.visible) { const points = [sourceStar.position.clone(), targetStar.position.clone()]; const line = new THREE.Line(new THREE.BufferGeometry().setFromPoints(points), lineMaterial); scene.add(line); linesRef.current.push(line); } }); } });
                }
            }, [publications, filters, temporalFilter, lens, focusedStar, pulsingConcept]);
            
            const projectToScreen = (positionVec, camera) => {
                if (!positionVec || !camera || !mountRef.current) return { x: 0, y: 0 };
                const rect = mountRef.current.getBoundingClientRect();
                const vector = positionVec.clone().project(camera);
                return { 
                    x: (vector.x + 1) / 2 * rect.width,
                    y: (-vector.y + 1) / 2 * rect.height
                };
            };
            return (
                <div className="w-full h-full relative">
                    <div ref={mountRef} id="galaxy-canvas"></div>
                    <div ref={tooltipRef} className="tooltip glass-effect"></div>
                    <div className="absolute top-0 left-0 w-full h-full pointer-events-none">
                        {constellationLabels.map(label => <WorldUILabel key={label.name} labelData={label} camera={cameraRef.current} canvasRef={mountRef} />)}
                        {planetLabels.map(label => {
                            const screenPos = projectToScreen(label.position, cameraRef.current);
                            return <div key={label.name} className="planet-label" style={{left: `${screenPos.x}px`, top: `${screenPos.y}px`}} onClick={(e) => { e.stopPropagation(); onPlanetClick(label.name); }}>{label.name}</div>
                        })}
                    </div>
                </div>
            );
        };
        
        // --- RESEARCH HUB & SUB-COMPONENTS ---
        const ResearchHub = ({ publication, onClose, initialTab }) => {
            const [activeTab, setActiveTab] = useState(initialTab || 'glance');
            const tabs = {glance: "At a Glance", chat: "Chat with this Paper", visualize: "Visualize Results", connections: "Explore Connections", video: "AI Video", game: "Edu-Game"};

                            <i className="fa-solid fa-triangle-exclamation text-5xl text-red-400 mb-4"></i>
                            <h2 className="text-2xl font-bold text-red-300 mb-2">Data Loading Failed</h2>
                            <p className="max-w-xl text-gray-400">{loadingError}</p>
                        </>
                    ) : (
                        <>
                            <div className="loader"></div>
                            <p className="mt-4 text-lg text-indigo-300">Calibrating the Knowledge Universe...</p>
                        </>
                    )}
                </div>
            );
            return (
                <div className="h-full w-full flex">
                    <div className={`flex-shrink-0 sidebar-transition overflow-hidden ${sidebarOpen ? 'w-full max-w-sm' : 'w-0'}`}>
                        <div className="p-4 sm:pt-6 pb-6 pl-6 pr-0 h-full flex flex-col w-full max-w-sm">
                             <header className="text-left mb-6 flex-shrink-0">
                                 <h1 className="text-3xl sm:text-4xl font-bold text-white tracking-tight">Star Engine</h1>
                                 <p className="mt-1 text-md text-indigo-300">Navigate the Universe of Space Biology</p>
                             </header>
                             <div className="glass-effect rounded-xl p-4 sm:p-6 flex-grow overflow-y-auto no-scrollbar">
                                 <div className="relative mb-4">
                                     <i className="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 z-10"></i>
                                     <input type="text" placeholder={`Ask a question or search ${publications.length} papers...`} value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)}
                                         onKeyPress={e => e.key === 'Enter' && handleGeminiSearch()}
                                         className="w-full bg-gray-900/50 border border-gray-600 rounded-lg py-3 pl-12 pr-12 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                                     <button onClick={handleGeminiSearch} title="Ask AI Assistant" className="absolute right-2 top-1/2 -translate-y-1/2 text-indigo-300 hover:text-white p-2 rounded-full transition-colors bg-gray-900/50 hover:bg-indigo-600 disabled:opacity-50" disabled={isGeminiSearching}>
                                        <i className="fa-solid fa-wand-magic-sparkles"></i>
                                     </button>
                                 </div>
                                 <div className="mb-4">
                                     <h3 className="font-semibold mb-3 text-gray-300">Analytical Lenses</h3>
                                     <div className="grid grid-cols-2 gap-2 text-sm">
                                         {['Default', 'Temporal', 'Mission', 'Consensus'].map(l => {
                                            const isConsensus = l === 'Consensus';
                                            return (
                                                <button 
                                                    key={l} 
                                                    onClick={() => !isConsensus && setActiveLens(l.toLowerCase())} 
                                                    className={`px-3 py-2 rounded-md transition-colors ${activeLens === l.toLowerCase() ? 'tab-active' : 'tab-inactive'} ${isConsensus ? 'opacity-50 cursor-not-allowed' : 'hover:bg-white/20'}`}
                                                    disabled={isConsensus}
                                                    title={isConsensus ? "Coming Soon" : ""}
                                                >
                                                    {l}{isConsensus ? ' (Beta)' : ''}
                                                </button>
                                            );
                                        })}
                                     </div>
                                 </div>
                                 {activeLens === 'temporal' && (
                                     <div className="mb-4">
                                         <h3 className="font-semibold mb-2 text-gray-300">Publication Year</h3>
                                         <input type="range" min={minYear} max={maxYear} value={temporalFilter.max} onChange={e => setTemporalFilter({...temporalFilter, max: parseInt(e.target.value)})} className="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer" />
                                         <div className="flex justify-between text-xs text-gray-400 mt-1"><span>{minYear}</span><span>{temporalFilter.max}</span><span>{maxYear}</span></div>
                                     </div>
                                 )}
                                 <details className="text-gray-300" open>
                                     <summary className="cursor-pointer font-semibold">Filter by Keywords</summary>
                                     <div className="flex flex-wrap gap-2 mt-4 max-h-80 overflow-y-auto">
                                         {allKeywords.map(keyword => (<button key={keyword} onClick={() => setSelectedFilters(p => p.includes(keyword) ? p.filter(k => k !== keyword) : [...p, keyword])} className={`px-3 py-1 text-sm font-medium rounded-full transition-all ${selectedFilters.includes(keyword) ? 'bg-indigo-500 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>{keyword}</button>))}
                                     </div>
                                 </details>
                             </div>
                        </div>
                    </div>
                    <div className="relative flex-1 h-full">
                         <div className="absolute top-1/2 -translate-y-1/2 left-0 z-20">
                             <button onClick={() => setSidebarOpen(!sidebarOpen)} className="glass-effect px-2 py-8 rounded-r-lg">
                                 <i className={`fa-solid ${sidebarOpen ? 'fa-chevron-left' : 'fa-chevron-right'}`}></i>
                             </button>
                         </div>
                         <GalaxyView 
                             publications={publications} 
                             onStarClick={(star) => { setFocusedStar(star); setPulsingConcept(null); }}
                             onStarDoubleClick={(pub) => { setHubInitialTab('glance'); setSelectedPublication(pub); }}
                             onBackgroundClick={() => { setFocusedStar(null); setPulsingConcept(null); }}
                             onPlanetClick={handleSetPulsingConcept}
                             focusedStar={focusedStar}
                             pulsingConcept={pulsingConcept}
                             filters={{filteredIds: filteredPublicationIds}}
                             temporalFilter={temporalFilter}
                             lens={activeLens}
                         />
                    </div>
                        {selectedPublication && <ResearchHub publication={selectedPublication} onClose={() => setSelectedPublication(null)} initialTab={hubInitialTab} />}
                        {(isGeminiSearching || geminiSearchResults || geminiSearchError) && 
                          <GeminiSearchResultsModal 
                            results={geminiSearchResults || []} 
                            isLoading={isGeminiSearching} 
                            error={geminiSearchError} 
                            onClose={() => {setGeminiSearchResults(null); setGeminiSearchError(null);}} 
                            onChatWithPaper={handleChatFromSearch}
                          />
                        }
                </div>
            );
        };
        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
